services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../..
      dockerfile: services/api/deploy/Dockerfile.api
    env_file:
      - ../.env
    ports:
      - "5000:5000"
    depends_on:
      - redis
    volumes:
      - ../data:/app/services/api/data

  price-ingest:
    build:
      context: ../../..
      dockerfile: services/api/deploy/Dockerfile.worker
    env_file:
      - ../.env
    command: ["bun", "run", "worker:ingest"]
    depends_on:
      - redis
    volumes:
      - ../data:/app/services/api/data

  catalog-sync:
    build:
      context: ../../..
      dockerfile: services/api/deploy/Dockerfile.worker
    env_file:
      - ../.env
    command: ["bun", "run", "worker:catalog"]
    depends_on:
      - redis
    profiles: ["ops"]
    volumes:
      - ../data:/app/services/api/data
