services:
  redis:
    image: redis:8.2.0-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: mock_trader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ../../..
      dockerfile: services/api/deploy/Dockerfile.api
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - postgres
    volumes:
      - ../data:/app/services/api/data

  price-ingest:
    build:
      context: ../../..
      dockerfile: services/api/deploy/Dockerfile.worker
    env_file:
      - ../.env
    command: ["bun", "run", "worker:ingest"]
    depends_on:
      - redis
    volumes:
      - ../data:/app/services/api/data

  catalog-sync:
    build:
      context: ../../..
      dockerfile: services/api/deploy/Dockerfile.worker
    env_file:
      - ../.env
    command: ["bun", "run", "worker:catalog"]
    profiles: ["ops"]
    volumes:
      - ../data:/app/services/api/data

volumes:
  postgres-data:
